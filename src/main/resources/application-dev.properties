# Se activa automaticamente en modo dev (quarkus:dev) o con QUARKUS_PROFILE=dev
# --- Seguridad JWT ---
mp.jwt.verify.issuer=${JWT_ISSUER}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
quarkus.smallrye-jwt.enabled=true


kafka.bootstrap.servers=${KAFKA_BOOTSTRAP}

quarkus.log.level=INFO
quarkus.log.category."org.indra".level=DEBUG
# En dev, permite que Angular en localhost:4200 llame directo sin pasar por el Gateway
quarkus.http.cors.origins=http://localhost:4200
quarkus.application.name=medical-reporting-service
quarkus.http.host=${HTTP_HOST}
quarkus.http.port=${HTTP_PORT}
quarkus.http.root-path=/report
quarkus.mongodb.database=${MONGO_DATABASE:hospital_reporting}
quarkus.mongodb.connection-string=${MONGO_URL:mongodb://localhost:27017}

quarkus.liquibase-mongodb.change-log=db/changeLog.xml
quarkus.liquibase-mongodb.migrate-at-start=true
quarkus.liquibase-mongodb.validate-on-migrate=true
quarkus.liquibase-mongodb.clean-at-start=false

# --- Kafka: mapeo de canales de entrada a los topics reales de cada microservicio ---
mp.messaging.incoming.patient-events-in.connector=smallrye-kafka
mp.messaging.incoming.patient-events-in.topic=${PATIENT_TOPIC:paciente.eventos}
mp.messaging.incoming.patient-events-in.value.deserializer=org.indra.medicalreportingservice.adapter.in.messaging.deserializer.PatientChangedEventDeserializer
mp.messaging.incoming.patient-events-in.group.id=${REPORTING_KAFKA_GROUP:reporting-service}
mp.messaging.incoming.patient-events-in.auto.offset.reset=earliest

mp.messaging.incoming.appointment-created-in.connector=smallrye-kafka
mp.messaging.incoming.appointment-created-in.topic=${APPOINTMENT_CREATED_TOPIC:appointment.created}
mp.messaging.incoming.appointment-created-in.value.deserializer=org.indra.medicalreportingservice.adapter.in.messaging.deserializer.AppointmentCreatedEventDeserializer
